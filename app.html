<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SMartorell">

    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="UTF-8">

    <title>SMartorell</title>

    <link rel="manifest" href="/manifest.json">

    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet-compass@1.5.6/dist/leaflet-compass.min.css">
    <link rel="stylesheet" href="https://unpkg.com/@tomickigrzegorz/leaflet-rotate/dist/leaflet-rotate.css">
    <link rel="stylesheet" href="./static/css/main.css">
</head>

<body>

    <div id="map"></div>

    <!-- Floating feature card -->
    <aside
        id="map-feature-card"
        class="map-feature-card"
        aria-label="Informació de l'element seleccionat"
        aria-hidden="true"
        hidden
    >
        <div class="map-feature-card__header">
            <h3 class="map-feature-card__title" id="map-feature-title"></h3>
            <button
                type="button"
                class="map-feature-card__close"
                aria-label="Tancar informació"
            >
                &times;
            </button>
        </div>

        <div class="map-feature-card__body" id="map-feature-content"></div>

        <footer class="map-feature-card__footer" id="map-feature-actions"> </footer>

    </aside>

    <aside id="sidebar">

        <div class="sidebar-header">

            <div class="logo">
                <div class="logo-icon">
                    <img src="https://noticies.martorell.cat/wp-content/uploads/2017/02/Martorell-positiu-98-pixels-01.png">
                </div>
            </div>

            <div class="header-actions">

                <button class="icon-button" id="searchButton" title="Cercar">
                    <span class="material-symbols-outlined">search</span>
                </button>

                <button class="icon-button" id="layerButton" title="Capes">
                    <span class="material-symbols-outlined">layers</span>
                </button>

                <button class="icon-button" id="accountButton" title="Compte">
                    <span class="material-symbols-outlined">account_circle</span>
                </button>

            </div>
        </div>

        <div class="separator"></div>

        <!-- Xarxes -->
        <section class="menu-section">

            <button
                class="section-header"
                id="networksButton"
                data-section="networks">

                <span>Xarxes</span>

                <span class="arrow">
                    <span class="material-symbols-outlined">
                        arrow_drop_down
                    </span>
                </span>

            </button>

            <div
                id="networks"
                class="section-content"
                hidden>
            </div>

        </section>

        <div class="separator"></div>

        <!-- Mapa base -->
        <section class="menu-section">

            <button class="section-header" data-section="basemaps">

                <span>Mapa base</span>

                <span class="arrow">
                    <span class="material-symbols-outlined">
                        arrow_drop_down
                    </span>
                </span>

            </button>

            <div id="basemaps" class="section-content">

                <label class="basemap-item">
                    <input type="radio" name="basemap" value="icgcEstandard" checked>
                    <span class="radio"></span>
                    <span>Estàndard</span>
                </label>

                <label class="basemap-item">
                    <input type="radio" name="basemap" value="icgcEstandardGris">
                    <span class="radio"></span>
                    <span>Estàndard Gris</span>
                </label>

                <label class="basemap-item">
                    <input type="radio" name="basemap" value="icgcTopografic">
                    <span class="radio"></span>
                    <span>Topogràfic</span>
                </label>

                <label class="basemap-item">
                    <input type="radio" name="basemap" value="icgcTopograficGris">
                    <span class="radio"></span>
                    <span>Topogràfic Gris</span>
                </label>

                <label class="basemap-item">
                    <input type="radio" name="basemap" value="icgcSimplificat">
                    <span class="radio"></span>
                    <span>Simplificat</span>
                </label>

                <label class="basemap-item">
                    <input type="radio" name="basemap" value="icgcOrtofoto">
                    <span class="radio"></span>
                    <span>Ortofoto</span>
                </label>

            </div>
        </section>

        <!-- Compte -->
        <section class="account-menu-section">

            <div id="account" class="account-section-content">

                <div id="accountInfo" class="account-info">

                    <div>
                        <span class="material-symbols-outlined">person</span>
                        <span>Nom d'usuari</span>
                        <span id="username"></span>
                    </div>

                    <div>
                        <span class="material-symbols-outlined">groups</span>
                        <span>Rol assignat</span>
                        <span id="userRole"></span>
                    </div>

                    <div>
                        <span class="material-symbols-outlined">token</span>
                        <span>Token(s) actiu(s)</span>
                        <span id="userToken"></span>
                    </div>

                </div>

                <div class="separator"></div>

                <div id="accountActions" class="account-actions">

                    <button id="userGuide">
                        <span class="material-symbols-outlined">news</span>
                        <span>Guia</span>
                    </button>

                    <button id="support">
                        <span class="material-symbols-outlined">contact_support</span>
                        <span>Suport</span>
                    </button>

                    <button id="logoutButton">
                        <span class="material-symbols-outlined">logout</span>
                        <span>Tanca sessió</span>
                    </button>

                </div>

            </div>

        </section>

    </aside>

    <!-- Controls mapa -->
    <div id="mapControls" class="map-controls collapsed">

        <div id="mapControlsButtons" class="map-controls-buttons">

            <button id="zoomInButton">
                <span class="material-symbols-outlined">add</span>
            </button>

            <button id="zoomOutButton">
                <span class="material-symbols-outlined">remove</span>
            </button>

            <button id="fullscreenButton">
                <span class="material-symbols-outlined">fullscreen</span>
            </button>

            <button id="rotateButton">
                <span class="material-symbols-outlined">explore</span>
            </button>

            <button id="locateButton">
                <span class="material-symbols-outlined">my_location</span>
            </button>

        </div>
        
        <button id="sidebarToggle" class="sidebar-toggle" title="Ocultar menú">
            <span class="material-symbols-outlined">arrow_back_ios</span>
        </button>

        <button id="mapControlsToggle" class="map-controls-toggle">
            <span class="material-symbols-outlined">
                keyboard_arrow_down
            </span>
        </button>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://unpkg.com/@tomickigrzegorz/leaflet-rotate/dist/leaflet-rotate.umd.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="module" src="./static/js/maps.js"></script>

    <script type="module" src="./static/js/controls.js"></script>
    <script type="module" src="./static/js/sidebar.js"></script>
    <script type="module" src="./static/js/networks.js"></script>

    <script type="module" src="./auth/auth.js"></script>
    <script type="module" src="./auth/logout.js"></script>

</body>
</html>
