<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martorell</title>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-compass@1.5.6/dist/leaflet-compass.min.css"/>
    <link rel="stylesheet" href="https://unpkg.com/@tomickigrzegorz/leaflet-rotate/dist/leaflet-rotate.css"/>
    <link rel="stylesheet" href="./static/css/main.css"/>
</head>

<body>
    <!-- Mapa -->
    <div id="map"></div>
    
    <!-- Panel lateral -->
    <aside id="sidebar">
        <!-- Capçalera lateral -->
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon"><img src="https://noticies.martorell.cat/wp-content/uploads/2017/02/Martorell-positiu-98-pixels-01.png"></div>
            </div>

            <!-- Icones capçelera -->
            <div class="header-actions">
                <button class="icon-button" id="searchButton" title="Cercar">
                    <span class="material-symbols-outlined">search</span>
                </button>

                <button class="icon-button" id="layerButton" title="Capes">
                    <span class="material-symbols-outlined">layers</span>
                </button>

                <button class="icon-button" id="accountButton" title="Compte">
                    <span class="material-symbols-outlined">account_circle</span>
                </button>
            </div>
        </div>

        <!-- Línia separadora -->
        <div class="separator"></div>

        <!-- Xarxes -->

        <section class="menu-section">
            <button class="section-header" data-section="networks">
                <span> Xarxes </span>
                <span class="arrow">
                    <span class="material-symbols-outlined"> arrow_drop_down</span>
                </span>
            </button>
        <div id="networks" class="section-content"></div>
        </section>

        <div class="separator"></div>

        <!--  Mapes base -->
        <section class="menu-section">
            <button class="section-header" data-section="basemaps" >
                <span> Mapa base </span>
                <span class="arrow">
                    <span class="material-symbols-outlined"> arrow_drop_down</span>
                </span>
            </button>

            <div id="basemaps" class="section-content">

                <label class="basemap-item">
                    <input type="radio" name="basemap" value="icgcEstandard" checked>
                    <span class="radio"></span>
                    <span>Estàndard</span>
                </label>

                <label class="basemap-item">
                    <input type="radio" name="basemap" value="icgcEstandardGris">
                    <span class="radio"></span>
                    <span>Estàndard Gris</span>
                </label>

                <label class="basemap-item">
                    <input type="radio" name="basemap" value="icgcTopografic">
                    <span class="radio"></span>
                    <span>Topogràfic</span>
                </label>

                <label class="basemap-item">
                    <input type="radio" name="basemap" value="icgcTopograficGris">
                    <span class="radio"></span>
                    <span>Topogràfic Gris</span>
                </label>

                <label class="basemap-item">
                    <input type="radio" name="basemap" value="icgcSimplificat">
                    <span class="radio"></span>
                    <span>Simplificat</span>
                </label>

                <label class="basemap-item">
                    <input type="radio" name="basemap" value="icgcOrtofoto">
                    <span class="radio"></span>
                    <span>Ortofoto</span>
                </label>
            
            </div>
        </section>

        <section class="account-menu-section">
            <div id="account" class="account-section-content">
                <div id="accountInfo" class="account-info">
                    <div>
                        <span class="material-symbols-outlined">person</span>
                        <span>Nom d'usuari</span>
                        <span id="username"></span>
                    </div>
                    <div>
                        <span class="material-symbols-outlined">groups</span>
                        <span>Rol asignat</span>
                        <span id="userRole"></span>
                    </div>
                </div>
                <div class="separator"></div>
                <div id="accountActions" class="account-actions">
                    <button id="userGuide">
                        <span class="material-symbols-outlined">news</span>
                        <span>Guia</span> 
                    </button>
                    <button id="support">
                        <span class="material-symbols-outlined">contact_support</span>
                        <span>Suport</span>
                    </button>
                    <button id="logoutButton">
                        <span class="material-symbols-outlined">logout</span>
                        <span>Tanca sessió</span>
                    </button>
                </div>
            </div>
        </section>

    </aside>

    <!-- Ocultar menú -->
    <button id="sidebarToggle" class="sidebar-toggle" title="Ocultar menú"><span class="material-symbols-outlined">arrow_forward_ios</span></button>

    <!-- Controls mapa -->
    <div id="mapControls" class="map-controls">
        <div id="mapControlsButtons" class="map-controls-buttons">
            <button id="zoomInButton">
                <span class="material-symbols-outlined">add</span>
            </button>
            <button id="zoomOutButton">
                <span class="material-symbols-outlined">remove</span>
            </button>
            <button id="fullscreenButton">
                <span class="material-symbols-outlined">fullscreen</span>
            </button>
            <button id="rotateButton">
                <span class="material-symbols-outlined">explore</span>
            </button>
            <button id="locateButton">
                <span class="material-symbols-outlined">my_location</span>
            </button>
        </div>
        <button id="mapControlsToggle" class="map-controls-toggle">
            <span class="material-symbols-outlined">keyboard_arrow_down</span>
        </button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Rotate Plugin -->
    <script src="https://unpkg.com/@tomickigrzegorz/leaflet-rotate/dist/leaflet-rotate.umd.min.js"></script>

    <!-- App JS -->
    <script src="./static/js/map.js"></script>
    <script src="./static/js/controls.js"></script>
    <script src="./static/js/sidebar.js"></script>
    <script src="./static/js/basemaps.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./auth/auth.js"></script>
    <script type="module" src="./auth/logout.js"></script>
    
</body>
</html>
