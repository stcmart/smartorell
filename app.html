<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martorell</title>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-compass@1.5.6/dist/leaflet-compass.min.css"/>
    <link rel="stylesheet" href="https://unpkg.com/@tomickigrzegorz/leaflet-rotate/dist/leaflet-rotate.css"/>
    <link rel="stylesheet" href="./static/css/main.css"/>
</head>

<body>
    <!-- Mapa -->
    <div id="map"></div>
    
    <!-- Panel lateral -->
    <aside id="sidebar">
        <!-- Capçalera lateral -->
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon"><img src="https://noticies.martorell.cat/wp-content/uploads/2017/02/Martorell-positiu-98-pixels-01.png"></div>
            </div>

            <!-- Icones capçelera -->
            <div class="header-actions">
                <button class="icon-button" id="searchButton" title="Cercar">
                    <span class="material-symbols-outlined">search</span>
                </button>

                <button class="icon-button" id="layerButton" title="Capes">
                    <span class="material-symbols-outlined">layers</span>
                </button>

                <button class="icon-button" id="alertButton" title="Alert">
                    <span class="material-symbols-outlined" style="color:#FDB430">add_alert</span>
                </button>

                <button class="icon-button" id="forbiddenButton" title="Forbidden">
                    <span class="material-symbols-outlined" style="color: #FD3130;">dangerous</span>
                </button>

            </div>
        </div>

        <!-- Línia separadora -->
        <div class="separator"></div>

        <!-- Xarxes -->

        <section class="menu-section">
            <button class="section-header" data-section="networks">
                <span> Xarxes </span>
                <span class="arrow">
                    <span class="material-symbols-outlined"> arrow_drop_down</span>
                </span>
            </button>
        <div id="networks" class="section-content"></div>
        </section>

        <div class="separator"></div>

        <!--  Mapes base -->
        <section class="menu-section">
            <button class="section-header" data-section="basemaps" >
                <span> Mapa base </span>
                <span class="arrow">
                    <span class="material-symbols-outlined"> arrow_drop_down</span>
                </span>
            </button>

            <div id="basemaps" class="section-content">

                <label class="basemap-item">
                    <input type="radio" name="basemap" value="icgcEstandard" checked>
                    <span class="radio"></span>
                    <span>Estàndard</span>
                </label>

                <label class="basemap-item">
                    <input type="radio" name="basemap" value="icgcEstandardGris">
                    <span class="radio"></span>
                    <span>Estàndard Gris</span>
                </label>

                <label class="basemap-item">
                    <input type="radio" name="basemap" value="icgcTopografic">
                    <span class="radio"></span>
                    <span>Topogràfic</span>
                </label>

                <label class="basemap-item">
                    <input type="radio" name="basemap" value="icgcTopograficGris">
                    <span class="radio"></span>
                    <span>Topogràfic Gris</span>
                </label>

                <label class="basemap-item">
                    <input type="radio" name="basemap" value="icgcSimplificat">
                    <span class="radio"></span>
                    <span>Simplificat</span>
                </label>

                <label class="basemap-item">
                    <input type="radio" name="basemap" value="icgcOrtofoto">
                    <span class="radio"></span>
                    <span>Ortofoto</span>
                </label>
            
            </div>
        </section>

    </aside>

    <!-- Ocultar menú -->
    <button id="sidebarToggle" class="sidebar-toggle" title="Ocultar menú"><span class="material-symbols-outlined">arrow_menu_close</span></button>

    <!-- Controls mapa -->
    <div id="mapControls" class="map-controls">
        <button id="zoomInButton" class="map-control-button" title="Més zoom"><span class="material-symbols-outlined">zoom_in</span></button>
        <button id="zoomOutButton" class="map-control-button" title="Menys zoom"><span class="material-symbols-outlined">zoom_out</span></button>
        <button id="locateButton" class="map-control-button" title="My location"><span class="material-symbols-outlined">my_location</span></button>    
        <button id="rotateButton" class="map-control-button" title="Rotate"><span class="material-symbols-outlined">move</span></button>
        <button id="fullscreenButton" class="map-control-button" title="Fullscreen"><span class="material-symbols-outlined">fullscreen</span></button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Rotate Plugin -->
    <script src="https://unpkg.com/@tomickigrzegorz/leaflet-rotate/dist/leaflet-rotate.umd.min.js"></script>

    <!-- App JS -->
    <script src="./static/js/map.js"></script>
    <script src="./static/js/controls.js"></script>
    <script src="./static/js/sidebar.js"></script>
    <script src="./static/js/basemaps.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./auth/auth.js"></script>
    
</body>
</html>
