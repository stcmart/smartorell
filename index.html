<!DOCTYPE html>
<html lang="ca">
<head>
    <link rel="manifest" href="/manifest.json">

    <meta name="theme-color" content="#ffffff">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SMartorell">

    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="UTF-8">
    <title>SMartorell</title>

    <link rel="stylesheet" href="./static/css/splash-screen.css"/>
</head>

<body>
    <div class="background-bottom"></div>
    <div class="splash-screen">
        <div class="logo-container">
            <img
                src="./assets/logo_blanc.png"
                alt="SMartorell"
                class="logo logo-base"
            >
            <img
                src="./assets/logo_blanc.png"
                alt=""
                class="logo logo-carregant"
            >
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        
        import { supabaseClient } from './auth/supabase.js';

        async function iniciarWebapp() {

            const { data, error } = await supabaseClient.auth.getSession();

            if (error) {
                console.error("Error comprovant la sessió:", error);
            }

            const session = data?.session;

            setTimeout(() => {

                if (session) {
                    window.location.href = "./app.html";
                } else {
                    window.location.href = "./auth/login.html";
                }

            }, 3000);
        }

        iniciarWebapp();
    </script>

</body>
</html>
